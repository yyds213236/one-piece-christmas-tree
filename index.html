<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050814; }
body { font: 14px Inter, "PingFang SC", system-ui, sans-serif; color: #e0e5f1; }
main {
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle farthest-corner at 50% 45%, #0b1337 0%, #0a1136 12%, #091131 23%, #09102d 33%, #090d27 43%, #060b23 55%, #050b20 66%, #040819 77%, #030814 86%, #040510 100%);
}
canvas { display: block; width: 100%; height: 100%; }
#aura {
  pointer-events: none;
  position: absolute;
  width: var(--diameter, 320px);
  height: var(--diameter, 320px);
  top: var(--top, 17%);
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  background: radial-gradient(circle, rgba(255,213,164,.59) 0%, rgba(230,184,130,.37) 24%, rgba(202,151,95,.16) 47%, transparent 72%);
}
#stage { position: absolute; inset: 0; }
.controls {
  display: flex;
  position: absolute;
  z-index: 1;
  right: max(15px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  gap: 2px;
  opacity: 0;
  transition: opacity .25s ease;
}
.controls:hover, .controls:focus-within { opacity: 1; }
button {
  width: 44px; height: 44px; display: grid; place-items: center;
  color: #d1d8eb; background: transparent;
  border: 1px solid transparent; border-radius: 50%;
  font: inherit; cursor: pointer;
}
button:hover, button:focus-visible { background: #151e34; border-color: #414961; }
button:focus-visible { outline: 2px solid #d0c6a0; outline-offset: 2px; }
button span { width: 15px; height: 15px; display: block; position: relative; }
#play span::before { content: ""; position: absolute; inset: 1px 3px; border-inline: 2px solid; }
#play[aria-pressed="true"] span::before { inset: 1px 0 1px 4px; border: solid transparent; border-width: 6px 0 6px 9px; border-left-color: currentColor; }
#restart span::before { content: ""; position: absolute; inset: 1px; border: 1.5px solid; border-bottom-color: transparent; border-radius: 50%; transform: rotate(-30deg); }
#restart span::after { content: ""; position: absolute; left: 0; top: 0; border: solid transparent; border-width: 3px 5px 3px 0; border-right-color: currentColor; transform: rotate(-36deg) translate(-1px, 2px); }
#full span { background: linear-gradient(currentColor,currentColor) left top/5px 1.5px,linear-gradient(currentColor,currentColor) left top/1.5px 5px,linear-gradient(currentColor,currentColor) right top/5px 1.5px,linear-gradient(currentColor,currentColor) right top/1.5px 5px,linear-gradient(currentColor,currentColor) left bottom/5px 1.5px,linear-gradient(currentColor,currentColor) left bottom/1.5px 5px,linear-gradient(currentColor,currentColor) right bottom/5px 1.5px,linear-gradient(currentColor,currentColor) right bottom/1.5px 5px; background-repeat: no-repeat; }
[hidden] { display: none; }
#message { position: relative; margin: auto; }
@media (hover: none) { .controls { opacity: .68; } }
@media (prefers-reduced-motion: reduce) { .controls { opacity: 1; transition: none; } }
</style>

const artwork = JSON.parse(document.querySelector("#particle-data").textContent);
const TAU = Math.PI * 2;
const DURATION = 18.9;
const WARM = [1, .87, .63];
const PALE = [.87, .88, 1];
const clamp = (x, low = 0, high = 1) => Math.max(low, Math.min(high, x));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (from, to, t) => {
  const x = clamp((t - from) / (to - from));
  return x * x * (3 - 2 * x);
};
const easeOut = (t) => 1 - (1 - t) ** 3;
let seed = 9743198;
function random() {
  seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
  return seed / 4294967296;
}
function scattered() {
  return (random() + random() + random() + random() - 2) * .86;
}

const maxPoints = 43000;
const pointData = new Float32Array(maxPoints * 7);
const lineData = new Float32Array(22000 * 7);
let pointLength = 0;
let lineLength = 0;
let width = 0;
let height = 0;
let dpr = 1;
let scale = 1;
let treeScale = 1;
let portraitScale = 1;
let raf = 0;
let time = reduceMotion.matches ? 5.6 : Math.max(0, Math.min(DURATION, Number(parameters.get("t")) || 0));
let playing = !reduceMotion.matches && !parameters.has("t");
let lastFrame = 0;

function write(buffer, offset, x, y, r, g, b, alpha, size) {
  buffer[offset] = x;
  buffer[offset + 1] = y;
  buffer[offset + 2] = r;
  buffer[offset + 3] = g;
  buffer[offset + 4] = b;
  buffer[offset + 5] = alpha;
  buffer[offset + 6] = size;
  return offset + 7;
}
function point(x, y, r, g, b, alpha, size) {
  if (alpha > .014 && pointLength < pointData.length) {
    pointLength = write(pointData, pointLength, x, y, r, g, b, alpha, size);
  }
}
function trail(x, y, endX, endY, r, g, b, alpha) {
  if (alpha > .026 && lineLength + 14 <= lineData.length) {
    lineLength = write(lineData, lineLength, x, y, r, g, b, alpha, 1);
    lineLength = write(lineData, lineLength, endX, endY, r, g, b, 0, 1);
  }
}

function decode(art) {
  const bytes = Uint8Array.from(atob(art.data), (char) => char.charCodeAt(0));
  const points = [];
  for (let i = 0; i < bytes.length; i += 7) {
    const color = [bytes[i + 4], bytes[i + 5], bytes[i + 6]];
    const value = Math.max(...color) / 255;
    const divisor = Math.max(32, ...color);
    points.push({
      x: (bytes[i] + bytes[i + 1] * 256) / 8,
      y: (bytes[i + 2] + bytes[i + 3] * 256) / 8,
      r: color[0] / divisor, g: color[1] / divisor, b: color[2] / divisor,
      value, phase: random() * TAU, wiggle: random(), drift: scattered()
    });
  }
  return points;
}

const background = Array.from({ length: 495 }, () => ({
  x: random(), y: random(), size: .6 + random() ** 6 * 1.9, phase: random() * TAU,
  alpha: .10 + random() ** 3 * .54
}));
const tree = Array.from({ length: 11000 }, (_, index) => {
  const u = random();
  const ribbon = index < 3400;
  const skirt = index > 10300;
  const y = skirt ? .945 + u * .052 : ribbon ? u : random() ** .76;
  const angle = ribbon ? y ** .81 * TAU * 16.25 + scattered() * .23 : random() * TAU;
  const radius = y ** 1.07 * (skirt ? 270 + random() * 50 : ribbon ? 252 : 255 * (.60 + random() * .46));
  const val = random();
  const base = ribbon ? (val > .70 ? [1, .96, .73] : [.72, .74, .83]) : (val > .68 ? [.51, .59, .91] : [.72, .76, .91]);
  const color = val < .035 ? [.96, .41, .66] : val > .98 ? [.29, .87, .95] : base;
  return {
    x: (random() - .5) * 1400,
    y: (random() - .5) * 800,
    z: angle, radius: Math.max(0, radius + scattered() * (ribbon ? 4 : 19)),
    height: y * 510 + scattered() * (ribbon ? 3.7 : 13) - 208,
    color, phase: random() * TAU, variation: random(), ribbon, skirt,
    opacity: ribbon ? .23 + random() ** 2.25 * 1.04 : .09 + random() ** 2.9 * .62,
    size: ribbon ? 1.45 + random() ** 2 * 3.6 : .99 + random() ** 2.2 * 1.62
  };
});

const skull = decode(artwork.skull);
const ornaments = artwork.ornaments.map((art) => ({
  width: art.width, height: art.height, track: art.track, points: decode(art)
}));
const topperPath = [
  [3.92, 675, -78, .94, 1], [4, 661, -20, .94, 1], [4.083, 651, 25, .94, 1],
  [4.167, 637, 69, .94, 1], [4.25, 634, 90, .94, 1], [4.333, 635, 110, .94, 1],
  [4.417, 637, 119, .94, 1], [4.50, 638, 126, .94, 1], [4.583, 639, 127, .94, 1]
];

function sampleTrack(keys, t) {
  if (t < keys[0][0]) return null;
  if (t >= keys[keys.length - 1][0]) return keys[keys.length - 1];
  let low = 0;
  let high = keys.length - 1;
  while (high - low > 1) {
    const middle = (low + high) >> 1;
    if (keys[middle][0] <= t) low = middle;
    else high = middle;
  }
  const a = keys[low];
  const b = keys[high];
  const u = (t - a[0]) / (b[0] - a[0]);
  return [t, mix(a[1], b[1], u), mix(a[2], b[2], u), mix(a[3], b[3], u), mix(a[4], b[4], u)];
}

const portrait = decode(artwork.portrait);
const vortex = Array.from({ length: 4950 }, () => {
  const angle = random() * TAU;
  const radius = random() ** 1.10;
  return { angle, radius, phase: random() * TAU, speed: .85 + random() * .5, size: .75 + random() * 1.15, tint: random() };
});

function drawSky(t) {
  const fade = 1 - smooth(18.14, 18.88, t);
  for (const star of background) {
    const x = (star.x - .5) * width / scale;
    const y = (star.y - .5) * height / scale;
    const flicker = .65 + Math.sin(t * 1.25 + star.phase) * .35;
    if (star.size > 1.8) point(x, y, .48, .59, .90, star.alpha * fade * .23, star.size * 4.1);
    point(x, y, .64, .72, .95, star.alpha * fade * flicker, star.size);
  }
}

function drawTree(t) {
  const opening = easeOut(clamp(t / .55));
  const initialStreak = 1 - smooth(.24, .94, t);
  const breakup = smooth(7.40, 9.15, t);
  const collapseVisibility = 1 - smooth(8.39, 9.16, t);
  const turn = (t - 3.8) * .54;

  for (let i = 0; i < tree.length; i++) {
    const p = tree[i];
    const a = p.z + turn;
    const depth = Math.sin(a);
    const stretch = 1 + depth * .11;
    const ringX = Math.cos(a) * p.radius * stretch;
    const ringY = p.height + depth * p.radius * .116 + 2 * Math.sin(p.phase + t * 1.2);
    const swirlAngle = a + breakup * (TAU * 2.2 + p.variation * .82);
    const swirlRadius = (62 + p.radius * .45) * (1 - breakup * .65);
    const whirl = breakup ** (.72 + 1.66 * p.variation);
    const x = mix(mix(p.x, ringX, opening), Math.cos(swirlAngle) * swirlRadius, whirl);
    const y = mix(mix(p.y, ringY, opening), Math.sin(swirlAngle) * swirlRadius, whirl);
    const sparkle = (.70 + .30 * Math.sin(t * (2.4 + p.variation * 3.2) + p.phase));
    const brightness = (.62 + depth * .38) * p.opacity * sparkle * (p.skirt ? .31 : 1);
    const fade = collapseVisibility * mix(brightness, .27 + brightness * .30, initialStreak);
    const col = initialStreak > .12 && i % 7 < 5 ? WARM : p.color;
    point(x, y, col[0], col[1], col[2], fade, p.ribbon && initialStreak < .18 ? -p.size : p.size);
    if (i % 3 === 0 && initialStreak > .06) {
      const a = Math.atan2(p.y, p.x) + p.variation * 1.65 - .82;
      const reach = Math.min(1, Math.hypot(p.x * .7, p.y) / 410);
      const length = initialStreak * (18 + p.variation * 125) * (.36 + .76 * reach);
      trail(x, y, x + Math.cos(a) * length, y + Math.sin(a) * length, col[0], col[1], col[2], fade * (1.36 + 2.51 * reach));
    }
    const debris = collapseVisibility * (1 - smooth(.65, .89, whirl)) * smooth(7.4, 7.85, t);
    if (i % 3 === 0 && debris > .05) {
      const length = 9 + p.variation * 27;
      trail(x, y, x + Math.cos(swirlAngle) * length, y + Math.sin(swirlAngle) * length, col[0], col[1], col[2], debris * brightness * 2.9);
    }
  }
  drawRibbons(t, opening * collapseVisibility, breakup, turn);
  for (const tag of ornaments) {
    const position = sampleTrack(tag.track, t);
    if (!position) continue;
    const [, x, y, size, opacity] = position;
    const fade = opacity * (1 - smooth(7.46, 8.83, t));
    drawMotif(tag.points, tag.width, tag.height, x - 640, y - 360, size, fade, t, .99, breakup);
  }

  const topper = sampleTrack(topperPath, t);
  if (topper) {
    const fade = 1 - smooth(7.66, 8.80, t);
    const lit = smooth(4.32, 4.70, t);
    const [, x, y, size] = topper;
    const cy = y - 360 + Math.sin(t * 2.7);
    aura.style.left = (width * .5 + (x - 640) * scale) + "px";
    aura.style.setProperty("--top", (height * .5 + cy * scale) + "px");
    aura.style.setProperty("--diameter", 410 * scale + "px");
    aura.style.opacity = (.82 + .18 * Math.cos((t - 5.09) * TAU / 1.55)) * lit * fade;
    drawMotif(skull, artwork.skull.width, artwork.skull.height, x - 640, cy, size, fade * (.72 + lit * .42), t, 1.3, breakup * .55);
  }
}

const ribbonLights = Array.from({ length: 1460 }, (_, index) => {
  const level = (index % 15 + .26) / 15;
  return {
    angle: random() * TAU,
    y: 510 * level ** 1.02 - 207 + scattered() * 2.6,
    r: (250 + scattered() * 12) * level ** 1.03,
    phase: random() * TAU,
    variation: random(),
    color: random() < .46 ? [1, .95, .70] : [.78, .83, 1]
  };
});

function drawRibbons(t, visibility, breakup, turn) {
  if (visibility < .04) return;
  for (const spark of ribbonLights) {
    const angle = spark.angle + turn;
    const near = Math.sin(angle);
    const crest = (.65 + .35 * Math.sin(angle * 3 + spark.phase));
    const twinkle = (.76 + .24 * Math.sin(t * 4.5 + spark.phase));
    const alpha = visibility * (1 - breakup) * twinkle * crest
      * (.15 + .85 * Math.max(0, near)) * (.13 + spark.variation ** 2.7 * 1.26);
    const x = Math.cos(angle) * spark.r;
    const y = spark.y + near * spark.r * .11 + 1.6 * Math.sin(angle * 5 + spark.y / 24);
    const [r, g, b] = spark.color;
    const size = 2.2 + 4.0 * spark.variation ** 3;
    const glare = 1.2 + 1.9 * spark.variation ** 3;
    point(x, y, r, g, b, alpha * glare, -size);
    if (spark.variation > .69) {
      const length = (1.6 + 4.7 * spark.variation) * near;
      trail(x, y, x + length, y - Math.cos(angle) * .48, r, g, b, alpha * glare * .93);
    }
  }
}

function drawMotif(points, w, h, cx, cy, size, fade, t, brightness, disruption) {
  if (fade < .03) return;
  for (const p of points) {
    const flicker = .78 + .22 * Math.sin(p.phase + t * (2 + p.wiggle * 8));
    const x = cx + (p.x - w / 2) * size + Math.sin(p.phase + t * 3) * (p.wiggle + 46 * disruption);
    const y = cy + (p.y - h / 2) * size + Math.cos(p.phase + t * 2) * (p.wiggle + 43 * disruption);
    const hat = brightness > 1 && p.y < h * .39 && Math.abs(p.x - w * .5) < w * .37;
    const pulse = hat ? smooth(4.38, 4.75, t) : 0;
    point(x, y, p.r, p.g * (1 - pulse * .07), p.b * (1 - pulse * .41), p.value * fade * flicker * brightness * 1.18, (1.05 + 1.55 * p.wiggle) * brightness);
  }
}

function drawVortex(t) {
  const emerge = smooth(7.38, 8, t);
  const compact = smooth(9.10, 9.52, t);
  const burst = smooth(9.92, 10.35, t);
  const radius = mix(mix(145, 230, emerge), 54, compact) + 150 * burst;
  const fade = emerge * (1 - burst);
  const cy = mix(28, 0, Math.max(emerge * .88, compact));
  if (fade <= 0) return;
  for (const p of vortex) {
    const a = p.angle + (t - 7.25) * (3.1 + 2.1 * (1 - p.radius)) * p.speed + 1.2 * compact;
    const r = radius * p.radius * (1 + .24 * Math.sin(a * 2 + p.phase) + .14 * Math.sin(a + p.phase));
    const x = Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * .89;
    const color = p.tint < .57 ? [1, .93, .72] : p.tint > .95 ? [.42, .86, 1] : PALE;
    const strength = fade * (2.15 - p.radius * 1.63) * (.67 + .3 * Math.sin(t * 6 + p.phase));
    const tailAngle = mix(.38 + .27 * Math.sin(p.phase), .26, compact) * p.speed;
    const blast = 1 + burst * 3.3;
    point(x, y, color[0], color[1], color[2], strength, p.size);
    trail(x, y, Math.cos(a - tailAngle) * r * (1 - .17 * Math.cos(p.phase)) / blast, cy + Math.sin(a - tailAngle) * r * .89 / blast, color[0], color[1], color[2], strength * 1.4);
  }
  point(0, cy, 1, .90, .65, .28 * fade, 164 * (1 - compact * .62));
}

function drawPortrait(t) {
  const reveal = smooth(9.93, 10.32, t);
  const lock = smooth(10.45, 12.28, t);
  const zoom = mix(.31, 1, 1 - (1 - clamp((t - 10.11) / 3.37)) ** 2.30);
  const fade = 1 - smooth(18.13, 18.86, t);
  const shock = Math.sin(Math.PI * smooth(9.92, 10.49, t));
  const loose = (1 - lock) * reveal;
  for (let i = 0; i < portrait.length; i++) {
    const p = portrait[i];
    const jitter = (p.wiggle + Math.abs(p.drift)) * (.64 + loose * 27);
    const baseX = (p.x - 640) * zoom;
    const baseY = (p.y - 360) * zoom;
    const x = baseX * (.44 + .56 * reveal) + Math.sin(p.phase + 4.7 * t) * jitter;
    const y = baseY * (.44 + .56 * reveal) + Math.cos(p.phase + 3.5 * t) * jitter;
    const twinkle = .72 + .28 * Math.sin(t * (3.2 + 8 * p.wiggle) + p.phase);
    const alpha = reveal * fade * (p.value * 2.60 + shock * .44) * twinkle;
    if (p.value > .23) point(x, y, p.r, p.g, p.b, alpha * .17, 4.05);
    point(x, y, p.r, p.g, p.b, alpha, (1.56 + 1.25 * p.wiggle) * (1 + .42 * shock));
    if (i % 5 === 0 && shock > .08) {
      trail(x, y, x * (1 - shock * .36), y * (1 - shock * .36), p.r, p.g, p.b, alpha * shock * .8);
    }
  }
}

function webglRenderer() {
  const gl = canvas.getContext("webgl", { alpha: true, antialias: true, depth: false, premultipliedAlpha: true });
  if (!gl) return null;
  function shader(type, code) {
    const handle = gl.createShader(type);
    gl.shaderSource(handle, code);
    gl.compileShader(handle);
    if (!gl.getShaderParameter(handle, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(handle));
    return handle;
  }
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, `
    attribute vec2 a_position;
    attribute vec4 a_tint;
    attribute float a_size;
    uniform vec2 u_view;
    uniform float u_scale;
    varying vec4 v_tint;
    varying float v_flat;
    void main() {
      gl_Position = vec4(a_position * vec2(2., -2.) * u_scale / u_view, 0., 1.);
      gl_PointSize = max(1.24, abs(a_size) * u_scale);
      v_tint = a_tint;
      v_flat = a_size < 0. ? .49 : 1.;
    }
  `));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform bool u_line;
    varying vec4 v_tint;
    varying float v_flat;
    void main() {
      float alpha = v_tint.a;
      if (!u_line) {
        float r = length((gl_PointCoord - .5) / vec2(1., v_flat)) * 2.;
        alpha *= 1. - smoothstep(.24, .98, r);
      }
      gl_FragColor = vec4(v_tint.rgb * alpha, alpha);
    }
  `));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  const buffers = [gl.createBuffer(), gl.createBuffer()];
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers[0]);
  gl.bufferData(gl.ARRAY_BUFFER, lineData.byteLength, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers[1]);
  gl.bufferData(gl.ARRAY_BUFFER, pointData.byteLength, gl.DYNAMIC_DRAW);
  const position = gl.getAttribLocation(program, "a_position");
  const tint = gl.getAttribLocation(program, "a_tint");
  const size = gl.getAttribLocation(program, "a_size");
  const view = gl.getUniformLocation(program, "u_view");
  const magnification = gl.getUniformLocation(program, "u_scale");
  const line = gl.getUniformLocation(program, "u_line");
  for (const attr of [position, tint, size]) gl.enableVertexAttribArray(attr);
  function batch(index, data, length, mode) {
    if (!length) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers[index]);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, length));
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 28, 0);
    gl.vertexAttribPointer(tint, 4, gl.FLOAT, false, 28, 8);
    gl.vertexAttribPointer(size, 1, gl.FLOAT, false, 28, 24);
    gl.uniform1i(line, mode === gl.LINES ? 1 : 0);
    gl.drawArrays(mode, 0, length / 7);
  }
  return () => {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(view, canvas.width, canvas.height);
    gl.uniform1f(magnification, scale * dpr);
    batch(0, lineData, lineLength, gl.LINES);
    batch(1, pointData, pointLength, gl.POINTS);
  };
}

function canvasRenderer() {
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  function color(data, i, alpha) {
    return `rgba(${Math.round(data[i + 2] * 255)},${Math.round(data[i + 3] * 255)},${Math.round(data[i + 4] * 255)},${clamp(alpha)})`;
  }
  return () => {
    ctx.setTransform(dpr, 0, 0, dpr, width * dpr / 2, height * dpr / 2);
    ctx.clearRect(-width / 2, -height / 2, width, height);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = .48;
    for (let i = 0; i < lineLength; i += 14) {
      ctx.strokeStyle = color(lineData, i, lineData[i + 5] * .46);
      ctx.beginPath();
      ctx.moveTo(lineData[i] * scale, lineData[i + 1] * scale);
      ctx.lineTo(lineData[i + 7] * scale, lineData[i + 8] * scale);
      ctx.stroke();
    }
    for (let i = 0; i < pointLength; i += 7) {
      const size = Math.max(.62, Math.abs(pointData[i + 6]) * scale * .66);
      const pointHeight = pointData[i + 6] < 0 ? Math.max(.56, size * .49) : size;
      ctx.fillStyle = color(pointData, i, pointData[i + 5] * .82);
      ctx.fillRect(pointData[i] * scale - size / 2, pointData[i + 1] * scale - pointHeight / 2, size, pointHeight);
    }
  };
}

let render = null;
let rendererName = "webgl";
try { render = webglRenderer(); } catch (error) { console.warn(error); }
if (!render) {
  if (canvas.getContext("webgl")) {
    const fresh = canvas.cloneNode();
    canvas.replaceWith(fresh);
    canvas = fresh;
  }
  rendererName = "canvas";
  render = canvasRenderer();
}

function draw() {
  if (!render) return;
  pointLength = 0;
  lineLength = 0;
  scale = mix(treeScale, portraitScale, smooth(9.96, 12.20, time));
  drawSky(time);
  aura.style.opacity = 0;
  if (time < 9.15) drawTree(time);
  if (time > 7.38 && time < 10.36) drawVortex(time);
  if (time > 9.93) drawPortrait(time);
  render();
}

function resize() {
  const bounds = canvas.getBoundingClientRect();
  width = bounds.width;
  height = bounds.height;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));
  portraitScale = Math.min(width / 1280, height / 720);
  treeScale = width / height < 1.18 ? Math.min(width / 696, height / 840) : portraitScale;
  draw();
}

function frame(timestamp) {
  raf = 0;
  if (!playing || document.hidden) return;
  if (lastFrame) time = (time + Math.min(.1, (timestamp - lastFrame) / 1000)) % DURATION;
  lastFrame = timestamp;
  draw();
  raf = requestAnimationFrame(frame);
}
function setPlaying(next) {
  playing = next;
  playButton.setAttribute("aria-pressed", String(!playing));
  const label = playing ? "暂停" : "播放";
  playButton.setAttribute("aria-label", label);
  playButton.title = label + " · 空格";
  cancelAnimationFrame(raf);
  raf = 0;
  lastFrame = 0;
  if (playing && !document.hidden) raf = requestAnimationFrame(frame);
  if (!playing) draw();
}
function replay() {
  time = 0;
  draw();
  setPlaying(true);
}
async function fullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (error) {
    console.warn(error.message);
  }
}
playButton.addEventListener("click", () => setPlaying(!playing));
restartButton.addEventListener("click", replay);
fullButton.addEventListener("click", fullscreen);
fullButton.hidden = !document.fullscreenEnabled;
document.addEventListener("fullscreenchange", () => {
  const label = document.fullscreenElement ? "退出全屏" : "全屏";
  fullButton.setAttribute("aria-label", label);
  fullButton.title = label + " · F";
});
document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
  if (event.code === "Space" && !event.target.closest("button")) {
    event.preventDefault();
    setPlaying(!playing);
  }
  if (event.code === "KeyR") replay();
  if (event.code === "KeyF" && !fullButton.hidden) fullscreen();
});
document.addEventListener("visibilitychange", () => setPlaying(playing));
reduceMotion.addEventListener("change", () => {
  if (reduceMotion.matches) {
    time = 5.6;
    setPlaying(false);
  }
});
if (render) {
  canvas.dataset.renderer = rendererName;
  addEventListener("resize", resize);
  canvas.addEventListener("webglcontextlost", (event) => {
    event.preventDefault();
    cancelAnimationFrame(raf);
    raf = 0;
  });
  canvas.addEventListener("webglcontextrestored", () => {
    render = webglRenderer();
    resize();
    setPlaying(playing);
  });
  resize();
  setPlaying(playing);
} else {
  document.querySelector("#message").hidden = false;
  document.querySelector(".controls").hidden = true;
}
</script>
</body>
</html>
